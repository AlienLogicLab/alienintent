name: Python architecture fitness

on: [push, pull_request]

permissions:
  contents: read

jobs:
  architecture-fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test tooling
        run: python -m pip install pytest
      - name: Enforce architecture fitness
        run: python tools/fitness/check_architecture.py --root src/alienintent --check all
      - name: Run architecture fitness regression tests
        run: python -m pytest tests/test_architecture_fitness.py -q
