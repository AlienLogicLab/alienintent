[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alienintent"
version = "0.0.0"
description = "AlienIntent Python architecture skeleton"
requires-python = ">=3.12"

[project.scripts]
alienintent = "alienintent.control_plane.adapters.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
